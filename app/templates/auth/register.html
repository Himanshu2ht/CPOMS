{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4">
<h4 class="mb-3">Create account</h4>
<form method="post">{{ csrf() }}
  <div class="mb-3"><label class="form-label">Full name</label><input name="name" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">College email</label><input name="email" type="email" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Password (min 8 chars)</label><input name="password" type="password" minlength="8" class="form-control" required></div>
  <button class="btn btn-primary w-100">Register</button>
</form></div></div></div></div>
{% endblock %}
