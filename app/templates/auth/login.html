{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4">
<h4 class="mb-1">Welcome back 👋</h4>
<p class="text-muted small">Login with your college email + password. Protected by rate-limiting & strong sessions.</p>
<form method="post">{{ csrf() }}
  <div class="mb-3"><label class="form-label">Email</label><input name="email" type="email" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
  <button class="btn btn-primary w-100">Login</button>
</form>
<p class="mt-3 mb-0 small">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div></div></div></div>
{% endblock %}
