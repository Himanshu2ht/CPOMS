{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow border-0 rounded-4">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3 mb-3" style="width: 56px; height: 56px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
          </div>
          <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
          <p class="text-muted small">Sign in with your registered college email to continue.</p>
        </div>

        <form method="post">{{ csrf() }}
          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">Email Address</label>
            <input name="email" type="email" class="form-control form-control-lg fs-6" placeholder="name@college.edu" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold text-secondary small">Password</label>
            <input name="password" type="password" class="form-control form-control-lg fs-6" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required>
          </div>
          <button class="btn btn-primary btn-lg w-100 fw-semibold fs-6 py-2">Sign In</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <p class="mb-0 small text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary text-decoration-none">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
