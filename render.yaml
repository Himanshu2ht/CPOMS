services:
  - type: web
    name: canteen-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DB_FALLBACK_SQLITE
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: canteen-db
          property: connectionString

databases:
  - name: canteen-db
    plan: free # NOTE: Render free Postgres expires after 30 days; for non-expiring free SQL use Supabase (see README)
